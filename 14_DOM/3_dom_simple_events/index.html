<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>

    <!-- 1. Button Click Counter -->
<button id="counter-btn">Click me</button>
<p>Clicks: <span id="counter">0</span></p>
<hr>

<!-- 2. Input Live Preview -->
<input id="preview-input" type="text" placeholder="Type something">
<p id="preview-text"></p>
<hr>

<!-- 3. Change Background on Hover -->
<div id="hover-box" style="width:150px; height:150px; border:1px solid black;">
  Hover me
</div>
    
</body>
</html>
